<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout.html}">
<head>
	<meta charset="UTF-8" />
	<title>보험료납입</title>
	<link rel="stylesheet" th:href="@{/mypage/css/payPremium.css}" />
</head>
<body>
	<main layout:fragment="content">
		
		<div class="base-main">
			<div class="navi-current">
				<span>홈</span>
				<span>계약관리</span>
				<span>보험료 납입</span>
				<span>장기보험 보험료납입</span>
			</div>
			
			<section class="base-content">
				
				<h1>보험료를 납입할 <br>계약을 선택해 주세요</h1>
	
				
				<table class="contract_table">
					<thead>
						<tr>
							<th>상품명(계약번호)</th>
							<th>최종납입일</th>
							<th>납입금액</th>
							<th>보험료</th>
							<th>상태</th>
						</tr>
					</thead>
					<tbody>
						<!-- 데이터가 있을 경우 -->
						<tr th:each="item, stat : ${dataListPayment}" th:if="${dataListPayment != null and !dataListPayment.isEmpty()}"
							th:data-contract-id="${item.contract_id}"
							th:data-payment-id="${item.payment_id}"
						    th:data-product-name="${item.product_name}"
						    th:data-payment-date="${item.payment_date}"
						    th:data-paid-amount="${item.paid_amount}"
						    th:data-total-premium="${item.total_premium}"
						    th:data-pay-status="${item.pay_status}"
						    class="contract-row">
								<td th:text="|${item.product_name}(${item.contract_id})|"></td>
								<td th:text="${item.payment_date}"></td>
								<td th:text="|${#numbers.formatInteger(item.paid_amount,0,'COMMA')} 원|"></td>
								<td th:text="|${#numbers.formatInteger(item.total_premium,0,'COMMA')} 원|"></td>
								<td th:text="${item.pay_status}"></td>
					    </tr>
					
					    <!-- 데이터가 없을 경우 -->
					    <tr th:if="${dataListPayment == null or dataListPayment.isEmpty()}">
					        <td class="no-data" colspan="6">확인 가능한 계약이 없습니다.</td>
					    </tr>
					</tbody>
				</table>
					
				<div class="tipBox">
					<dl>
						<dt><img th:src="@{/mypage/images/text-bubble.png}" alt="말풍선 아이콘">확인해 주세요</dt>
						<dd>· 보험료 납입은 365일 24시간 가능합니다. 단, 은행별 시스템 점검시간(23:30~다음날 01:00)에는 납입할 수 없습니다.</dd>
						<dd>· 오늘 가입하신 보험은 확인되지 않을 수 있습니다. 다음 영업일에 다시 확인해 주세요.</dd>
					</dl>
				</div>
				
			</section>
		</div>
	
		<script th:src="@{/mypage/js/payPremium2.js}"></script>
	</main>
</body>
</html>
