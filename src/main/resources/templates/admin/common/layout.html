<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8" />
	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_header" th:content="${_csrf.headerName}" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title layout:title-pattern="$CONTENT_TITLE - 관리자 시스템">관리자 시스템</title>

	<link rel="icon" type="image/png" th:href="@{/common/images/favicon.png(v=${#dates.createNow().getTime()})}">
	
	<!-- 공통 CSS (모듈화) -->
	<link rel="stylesheet" th:href="@{/admin/css/admin.css}" />
	<link rel="stylesheet" th:href="@{/admin/css/list.css}" />

	<!-- 페이지별 추가 <head> 자원 삽입 슬롯 -->
	<th:block layout:fragment="extraHead"></th:block>
</head>

<body class="admin-root" th:data-profile="${profile}">

	<!-- 헤더 (공통 프래그먼트) -->
	<header th:replace="~{admin/common/fragments/header :: headerFragment}"></header>

	<div class="admin-shell">

		<!-- 본문 컨테이너 -->
		<div class="admin-content-wrap">

			<!-- 메인 콘텐츠 슬롯 -->
			<main id="main-content" layout:fragment="adminContent" class="admin-main"
				style="width: 1200px; margin: 137px auto 0 auto;">
				<!-- 개별 페이지에서 이 영역을 대체합니다. -->
			</main>
		</div>
	</div>

	<!-- 푸터 (공통 프래그먼트) -->
	<footer th:replace="~{admin/common/fragments/footer :: footerFragment}"></footer>
	
	<!-- 전역 스크립트 (모듈화) -->
	<script th:inline="javascript">
		const profileFromDataset = document.body.dataset.profile;
		if (profileFromDataset === "dev") { console.log("개발환경용 JS 실행"); }
		
		const contextPath = /*[[@{/}]]*/ '';
	</script>

	
	<script type="module" th:src="@{/admin/js/pagination.js}"></script>
	<script type="module" th:src="@{/admin/js/dateRange.js}"></script>
	
	
</body>

</html>
