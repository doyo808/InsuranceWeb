<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>UiPath</title>
  <style>
    form {
      width: 600px;
      margin: 40px auto;
      font-family: '맑은 고딕', sans-serif;
    }
    textarea {
      width: 100%;
      height: 300px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
    }
    input[type="text"], input[type="submit"] {
      margin-top: 10px;
      padding: 8px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <form th:action="@{/internal/notice/receive}" method="POST">
    <h2>공지 자동 등록</h2>
    <textarea name="content" placeholder="결과 텍스트 입력" required></textarea>
    <input type="password" name="key" placeholder="인증키 입력" required>
    <input type="submit" value="전송하기">
  </form>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    form.addEventListener('keydown', function(event) {
      // textarea에서는 엔터 허용
      if (event.target.tagName === 'TEXTAREA') return;
      // 그 외 input에서는 엔터 막기
      if (event.key === 'Enter') {
        event.preventDefault();
      }
    });
  });
  </script>

</body>
</html>
