<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/common/layout}">

<head>
	<meta charset="utf-8" />
	<title>보험계약 상세 내역</title>

	<th:block layout:fragment="extraHead">
		<link rel="stylesheet" th:href="@{/admin/css/claimDetail.css}" />
	</th:block>
</head>

<body>
	<main layout:fragment="adminContent">
		<section class="claim-detail">
			<!-- 타이틀 -->
			<div class="title-row">
				<h2 class="page-title">
					보험계약 상세 내역
					<span class="muted" th:text="'(#' + ${detail.contract_id} + ')'"></span>
				</h2>
			</div>

			<!-- 요약 정보 -->
			<div class="summary-grid">
				<div class="card">
					<p class="label">계약 상태</p>
					<p class="value">
						<span th:switch="${detail.status}">
							<span th:case="'PENDING'">접수</span>
							<span th:case="'APPROVED'">승인완료</span>
							<span th:case="'ACTIVE'">계약진행중</span>
							<span th:case="'EXPIRED'">계약종료</span>
							<span th:case="'CANCELLED'">해지</span>
							<span th:case="'REJECTED'">거절</span>
							<span th:case="'SUSPENDED'">일시중지</span>
							<span th:case="'TERMINATED'">중도해지</span>
							<span th:case="*">기타</span>
						</span>

					</p>
				</div>
				<div class="card">
					<p class="label">계약 시작일</p>
					<p class="value" th:text="${#temporals.format(detail.start_date,'yyyy-MM-dd')}"></p>
				</div>
				<div class="card">
					<p class="label">계약 종료일</p>
					<p class="value" th:text="${#temporals.format(detail.end_date,'yyyy-MM-dd')}"></p>
				</div>
				<div class="card">
					<p class="label">월 보험료</p>
					<p class="value" th:text="${detail.total_premium != null} ? ${detail.total_premium} + '원' : '-'">
					</p>
				</div>
			</div>

			<hr class="divider" />

			<!-- 상품 정보 -->
			<div class="section">
				<h3 class="section__title">상품 정보</h3>
				<p class="section__desc">고객이 가입한 상품정보입니다.</p>
				<div class="item">
					<label>상품명</label>
					<div class="value" th:text="${detail.product_name}"></div>
				</div>
				<div class="item">
					<label>상품 유형</label>
					<div class="value" th:text="${detail.product_types}"></div>
				</div>
			</div>

			<hr class="divider" />

			<!-- 고객 정보 -->
			<div class="section">
				<h3 class="section__title">고객 정보</h3>
				<p class="section__desc">보험계약자의 개인 정보입니다.</p>
				<div class="item">
					<label>고객명</label>
					<div class="value" th:text="${detail.customer_name}"></div>
				</div>
				<div class="item">
					<label>고객 연락처</label>
					<div class="value" th:text="${detail.phone_number}"></div>
				</div>
				<div class="item">
					<label>이메일</label>
					<div class="value" th:text="${detail.email}"></div>
				</div>
			</div>

			<hr class="divider" />

			<!-- 피보험자 정보 -->
			<div class="section">
				<h3 class="section__title">피보험자 정보</h3>
				<p class="section__desc">피보험자의 개인 정보입니다.</p>
				<div class="item">
					<label>피보험자명</label>
					<div class="value" th:text="${detail.insured_name}"></div>
				</div>
				<div class="item">
					<label>성별</label>
					<div class="value" th:text="${detail.gender}"></div>
				</div>
				<div class="item">
					<label>흡연여부</label>
					<div class="value" th:text="${detail.is_smoker}"></div>
				</div>
				<div class="item">
					<label>음주여부</label>
					<div class="value" th:text="${detail.drinks}"></div>
				</div>
				<div class="item">
					<label>운전상태</label>
					<div class="value" th:text="${detail.driving_status}"></div>
				</div>
				<div class="item">
					<label>병력</label>
					<div class="value" th:text="${detail.medical_history}"></div>
				</div>
			</div>

			<hr class="divider" />

			<!-- 보장 내역 -->
			<div class="section">
				<h3 class="section__title">보장 내역</h3>
				<p class="section__desc">계약에 포함된 담보별 보장 금액입니다.</p>

				<section class="table-wrap">
					<table class="table">
						<thead>
							<tr>
								<th>담보명</th>
								<th>설명</th>
								<th>보장 금액</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="cov : ${detail.coverages}">
								<td th:text="${cov.cover_name}"></td>
								<td th:text="${cov.cover_desc}"></td>
								<td th:text="${#numbers.formatInteger(cov.coverage_amount,3,'COMMA')} + '원'"></td>
							</tr>
							<tr th:if="${#lists.isEmpty(detail.coverages)}">
								<td colspan="3" class="text-center muted">등록된 보장 내역이 없습니다.</td>
							</tr>
						</tbody>
					</table>
				</section>
			</div>

			<hr class="divider" />

			<!-- 승인/거절 액션 -->
			<div class="btn-row">
				<a th:href="@{/admin/contract}" class="btn back">이전</a>

				<div th:if="${detail.status} == 'PENDING'">
					<button type="button" class="btn success" id="openApprove">승인</button>
					<button type="button" class="btn danger" id="openReject">거절</button>
				</div>

				<!-- 승인 모달 -->
				<dialog id="approveDialog" class="modal">
					<form method="post" th:action="@{/admin/contract/{id}/approve(id=${detail.contract_id})}">
						<h3 class="modal__title">계약 승인</h3>
						<p class="modal__desc">해당 계약을 승인하시겠습니까?</p>
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<div class="modal__actions">
							<button type="button" class="btn" id="cancelApprove">취소</button>
							<button type="submit" class="btn success">승인 확정</button>
						</div>
					</form>
				</dialog>

				<!-- 거절 모달 -->
				<dialog id="rejectDialog" class="modal">
					<form method="post" th:action="@{/admin/contract/{id}/reject(id=${detail.contract_id})}">
						<h3 class="modal__title">거절 사유 입력</h3>
						<p class="modal__desc">거절 사유를 구체적으로 작성해 주세요. (최대 500자)</p>
						<textarea name="reason" id="rejectReason" rows="6" maxlength="500" required
							placeholder="예) 제출 서류 누락으로 인해 반려합니다."></textarea>
						<div class="char-counter"><span id="len">0</span>/500</div>
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<div class="modal__actions">
							<button type="button" class="btn" id="cancelReject">취소</button>
							<button type="submit" class="btn danger">거절 확정</button>
						</div>
					</form>
				</dialog>
			</div>
		</section>

		<script>
			document.addEventListener('DOMContentLoaded', () => {
				const openApprove = document.getElementById('openApprove');
				const approveDialog = document.getElementById('approveDialog');
				const cancelApprove = document.getElementById('cancelApprove');
				const openReject = document.getElementById('openReject');
				const rejectDialog = document.getElementById('rejectDialog');
				const cancelReject = document.getElementById('cancelReject');
				const reasonEl = document.getElementById('rejectReason');
				const lenEl = document.getElementById('len');

				openApprove?.addEventListener('click', () => approveDialog.showModal());
				cancelApprove?.addEventListener('click', () => approveDialog.close());

				openReject?.addEventListener('click', () => {
					reasonEl.value = '';
					lenEl.textContent = '0';
					rejectDialog.showModal();
					reasonEl.focus();
				});
				cancelReject?.addEventListener('click', () => rejectDialog.close());

				reasonEl?.addEventListener('input', () => lenEl.textContent = reasonEl.value.length);
			});
		</script>
	</main>
</body>

</html>
