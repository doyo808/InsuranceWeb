<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{/common/layout.html}">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>포인트 적립/사용내역 확인 | 혜택/서비스 - 삼성화재 다이렉트 착</title>
	<link rel="stylesheet" th:href="@{/club/css/club_common.css}">
	<link rel="stylesheet" th:href="@{/club/css/PP050401_001.css}">
	
	<style>
	  /* 테이블 기본 정렬 보정 */
	  table.tbl-base {
	    width: 100%;
	    border-collapse: collapse;
	
	  }

	  table.tbl-base th,
	  table.tbl-base td {
	    text-align: center;
	    vertical-align: middle; /* ✅ 버튼이 세로 중앙정렬되게 */
	    padding: 14px 10px;
	  }
	  
	  table.tbl-base td { font-size: 18px; }

	  /* 선택 버튼 스타일 */
	  .choice button {
	    display: inline-block;
	    padding: 8px 16px;
	    font-size: 17px;
	    border: 1px solid #007bff;
	    border-radius: 6px;
	    background-color: #007bff;
	    color: #fff;
	    cursor: pointer;
	    transition: all 0.2s ease;
		white-space: nowrap;
	  }

	  .choice button:hover {
	    background-color: #0056b3;
	    border-color: #0056b3;
	  }

	  /* 버튼이 너무 위쪽/아래쪽에 붙지 않도록 */
	  .choice {
	    height: 60px; /* 테이블 높이 균일화 */
	  }

	  /* 테이블 행 hover 효과 (선택하기 편하게) */
	  table.tbl-base tr:hover {
	    background-color: #f9f9f9;
	  }

	</style>

	
</head>

<body>
	<main layout:fragment="content">
		<div class="ui-tab-pnls">
			<section class="base-content">
				<div class="content-layout ani-point"> <!--content 부분-->

					<div class="content-title"> <!-- 제목 -->
						<h1>
							계약 중인 보험 중 <br>
							청구를 희망하는 보험을 선택해주세요
						</h1>
					</div>

					<div class="content-main">

						<div class="tit-wrap-m">
							<h2 class="tit-con">보험 계약 내역</h2>
						</div>

						<form th:action="@{/claim/selectContract}" method="post">
							<table class="tbl-base col4">
								<colgroup>
									<col>
									<col>
									<col>
									<col>
								</colgroup>

								<thead>
									<tr>
										<th>계약번호</th>
										<th>상품명</th>
										<th>계약일자</th>
										<th>만기일자</th>
										<th>선택</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="c : ${contracts}">
										<td th:text="${c.contract_id}"></td>
										<td th:text="${c.product_name}"></td>
										<td th:text="${#temporals.format(c.start_date, 'yyyy-MM-dd')}"></td>
										<td th:text="${#temporals.format(c.end_date, 'yyyy-MM-dd')}"></td>
										<td class="choice">
											<button type="submit" name="contractId"
												th:value="${c.contract_id}">선택</button>
										</td>
									</tr>
								</tbody>
							</table>
						</form>
					</div>
				</div>
			</section>
		</div>
	</main>
</body>

</html>
