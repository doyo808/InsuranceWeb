<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout.html}">

<head>
    <meta charset="UTF-8" />
    <title>보험금 청구 완료</title>
    <style>
        .error-container {
            max-width: 600px;
            margin: 120px auto;
            text-align: center;
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .error-container h1 {
            color: #007bff;
            font-size: 2em;
            margin-bottom: 20px;
        }
        .error-container p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 30px;
			white-space: pre-line;
        }
        .error-container a {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .error-container a:hover {
            background-color: #0056b3;
        }
		
		/* 성공 아이콘 (SVG) 스타일 */
		.success-icon {
			width: 80px;
			height: 80px;
			margin-bottom: 20px;
		}

		.success-icon .circle {
			stroke-dasharray: 166;
			stroke-dashoffset: 166;
			stroke-width: 2;
			stroke-miterlimit: 10;
			stroke: #7ac142;
			fill: none;
			animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
		}

		.success-icon .checkmark {
			stroke-dasharray: 48;
			stroke-dashoffset: 48;
			stroke-width: 2;
			stroke-linecap: round;
			stroke-miterlimit: 10;
			stroke: #7ac142;
			fill: none;
			animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
		}

		@keyframes stroke {
			100% {
				stroke-dashoffset: 0;
			}
		}

		.spacer {
			height: 20px;
		}
    </style>
</head>

<main layout:fragment="content">
	<div class="spacer"></div>
    <div class="error-container">
		
		<svg class="success-icon" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
			<circle class="circle" cx="26" cy="26" r="25" fill="none"/>
			<path class="checkmark" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
		</svg>
		
        <h1>보험금 청구가 완료되었습니다</h1>
        <p th:text="${errorMessage}">빠른시일 내에 검토하여 안내드리겠습니다.</p>
        <a th:href="@{/}">홈으로 돌아가기</a>
    </div>
</main>

</html>
