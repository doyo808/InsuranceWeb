<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/common/layout.html}">

<head>
  <meta charset="UTF-8">
  <title>보험금 청구 - 사고 정보</title>
  <style>
    .container { max-width: 850px; margin: 0 auto 80px; padding: 80px;}
    .section { margin: 20px 0; }
    .label { font-weight: bold; margin-bottom: 8px; display: block; }
    .input-box { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    .category-box { display: flex; gap: 10px; margin-top: 10px; }
    .category-btn { flex: 1; text-align: center; padding: 12px; border: 1px solid #ccc; border-radius: 10px; cursor: pointer; background-color: #f9f9f9; user-select: none; }
    .category-btn.active { border: 2px solid #007bff; background-color: #eaf3ff; font-weight: bold; }
    .hidden { display: none; }
    .radio-group { margin-top: 10px; }
    .radio-group label { margin-right: 20px; }
    .button-area { display: flex; justify-content: space-around; margin: 40px 0; }
    .btn-primary { background: #007bff; color: #fff; font-size: 16px; font-weight: bold; padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer; text-decoration: none; text-align: center; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>

<body>
<main layout:fragment="content">
  <div class="container">
    <form th:action="@{/claim/accidentInfo}" method="post">

      <!-- 사고일 -->
      <div class="section">
        <label class="label">사고일/발병일</label>
        <input type="date" id="dateSelector" name="accidentDate" class="input-box"
               th:value="${claim != null and claim.accident_date != null ? #dates.format(claim.accident_date, 'yyyy-MM-dd') : ''}">
      </div>

      <!-- 사고유형 -->
      <div class="section">
        <label class="label">사고유형</label>
        <div class="category-box">
          <div class="category-btn" data-type="injury"
               th:classappend="${claim != null and claim.accident_type=='injury'} ? ' active' : ''">상해</div>
          <div class="category-btn" data-type="disease"
               th:classappend="${claim != null and claim.accident_type=='disease'} ? ' active' : ''">질병</div>
          <div class="category-btn" data-type="traffic"
               th:classappend="${claim != null and claim.accident_type=='traffic'} ? ' active' : ''">교통사고</div>
          <input type="hidden" id="accidentType" name="accidentType"
                 th:value="${claim != null ? claim.accident_type : ''}">
        </div>

        <!-- 상해/교통사고 -->
        <textarea id="accidentDesc" name="accidentDesc" class="input-box"
                  placeholder="사고내용을 입력하세요"
                  th:classappend="${claim == null or !(claim.accident_type=='injury' or claim.accident_type=='traffic')} ? ' hidden' : ''"
                  th:text="${claim != null ? claim.accident_description : ''}"></textarea>

        <!-- 질병 -->
        <select id="diseaseSelect" name="diseaseType" class="input-box"
                th:classappend="${claim == null or claim.accident_type!='disease'} ? ' hidden' : ''">
          <option value="">주요진단을 선택하세요</option>
          <option value="감기" th:selected="${claim != null and claim.disease_type=='감기'}">감기</option>
          <option value="기관지염" th:selected="${claim != null and claim.disease_type=='기관지염'}">기관지염</option>
          <option value="허리통증" th:selected="${claim != null and claim.disease_type=='허리통증'}">허리통증</option>
          <option value="목통증" th:selected="${claim != null and claim.disease_type=='목통증'}">목통증</option>
          <option value="기타" th:selected="${claim != null and claim.disease_type=='기타'}">기타</option>
        </select>

        <textarea id="diseaseDetail" name="diseaseDetail" class="input-box"
                  placeholder="진단 내용을 입력하세요"
                  th:classappend="${claim == null or claim.accident_type!='disease' or #strings.isEmpty(claim.disease_type)} ? ' hidden' : ''"
                  th:text="${claim != null ? claim.disease_detail : ''}"></textarea>
      </div>

      <!-- 의료급여 수급권자 여부 -->
      <div class="section">
        <label class="label">의료급여 수급권자 여부</label>
        <div class="radio-group">
          <label><input type="radio" name="medical_benefits" value="yes"
                        th:checked="${claim != null and claim.medical_benefits=='Y'}"> 예 (의료급여 1·2종)</label>
          <label><input type="radio" name="medical_benefits" value="no"
                        th:checked="${claim != null and claim.medical_benefits=='N'}"> 아니요</label>
        </div>
      </div>

      <!-- 버튼 -->
      <div class="button-area">
        <a th:href="@{/claim/personInfo}" class="btn-primary" style="background:#6c757d;">이전</a>
        <button type="submit" class="btn-primary">다음</button>
      </div>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const buttons = document.querySelectorAll('.category-btn');
      const hiddenType = document.getElementById('accidentType');
      const accidentDesc = document.getElementById('accidentDesc');
      const diseaseSelect = document.getElementById('diseaseSelect');
      const diseaseDetail = document.getElementById('diseaseDetail');
      const form = document.querySelector("form");
      const dateInput = document.getElementById('dateSelector'); // 🔹 사고일 input

      // 표시/숨김 제어 함수
      function applyVisibility(type) {
        accidentDesc.classList.add('hidden');
        diseaseSelect.classList.add('hidden');
        diseaseDetail.classList.add('hidden');

        if (type === 'injury' || type === 'traffic') {
          accidentDesc.classList.remove('hidden');
        } else if (type === 'disease') {
          diseaseSelect.classList.remove('hidden');
          if (diseaseSelect.value && diseaseSelect.value.trim() !== '') {
            diseaseDetail.classList.remove('hidden');
          }
        }
      }

      // ✅ 초기 렌더링 상태 반영
      const initialType = hiddenType.value;
      if (initialType) applyVisibility(initialType);
      else applyVisibility('');

      // ✅ 사고유형 버튼 클릭 이벤트
      buttons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const type = btn.dataset.type;
          hiddenType.value = type;

          // ✅ 클릭 시 유형에 따라 값 초기화
          if (type === 'injury') {
            diseaseSelect.value = "";
            diseaseDetail.value = "";
          } else if (type === 'disease') {
            accidentDesc.value = "";
          } else if (type === 'traffic') {
            diseaseSelect.value = "";
            diseaseDetail.value = "";
          }

          applyVisibility(type);
        });
      });

      // ✅ 질병 선택 시 상세 내용 표시
      diseaseSelect.addEventListener('change', () => {
        if (diseaseSelect.value && diseaseSelect.value.trim() !== '') {
          diseaseDetail.classList.remove('hidden');
        } else {
          diseaseDetail.classList.add('hidden');
          diseaseDetail.value = "";
        }
      });

      // ✅ 날짜: 오늘 이후 선택 불가
      const today = new Date();
      const tz = new Date(today.getTime() - today.getTimezoneOffset() * 60000);
      dateInput.max = tz.toISOString().split('T')[0];

      // ✅ "다음" 버튼 클릭 시 필수값 검증
      form.addEventListener("submit", (e) => {
        const accidentType = hiddenType.value.trim();
        const medicalSelected = document.querySelector('input[name="medical_benefits"]:checked');
        const dateValue = dateInput.value.trim(); // 🔹 날짜 값 가져오기

        // 🔹 사고일 미입력 시 경고
        if (!dateValue) {
          e.preventDefault();
          alert("사고일(발병일)을 입력해주세요.");
          return;
        }

        if (!accidentType) {
          e.preventDefault();
          alert("사고유형을 선택해주세요.");
          return;
        }

        if (!medicalSelected) {
          e.preventDefault();
          alert("의료급여 수급권자 여부를 선택해주세요.");
          return;
        }

        // 🔹 질병일 때 진단명 미선택 시 알림
        if (accidentType === 'disease' && !diseaseSelect.value) {
          e.preventDefault();
          alert("질병 유형을 선택해주세요.");
          return;
        }

        // 모든 필수값이 있으면 정상 제출
      });
    });
  </script>



</main>
</body>
</html>
