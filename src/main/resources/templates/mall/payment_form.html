<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{mall/layout/layout_mall.html}">
<head>
	<meta charset="UTF-8" />
	<title>결제정보 입력</title>
	<style>

		
		.payment_wrapper {
			max-width: 1200px;
			margin: 0 auto;
			text-align: center;
		}
		
		.payment_wrapper h1 {
			text-align: center;
			margin-bottom: 30px; /* H1과 테스트 버튼 사이 여백 */
		}
		
		.next-btn:disabled {
			cursor: not-allowed;
		}

		.test-button-wrap {
		    text-align: center;
		    /* 테스트 버튼과 폼(카드 제목) 사이 여백 */
		    margin: 20px 0 50px 0;
		}

		#test_pay_btn,
		#test_complete_btn {
		    background-color: #ffffff;
		    border: 1px solid #007bff;
		    color: #007bff;
		    padding: 8px 16px;
		    margin: 0 5px;
		    border-radius: 5px;
		    cursor: pointer;
		    font-weight: bold;
		    font-size: 14px;
		    transition: all 0.2s ease;
		}

		#test_pay_btn:hover,
		#test_complete_btn:hover {
		    background-color: #007bff;
		    color: #ffffff;
		}
		.card-notice {
		    text-align: left;
		    font-size: 0.85rem; 
		    color: #777; 
		    margin: 15px 0 0 120px; 
		}
		/* 카드 정보 테이블 제목 */
		.table-title {
			font-size: 1.3rem; 
			font-weight: 600;
			margin-bottom: 15px; 
			text-align: left;
			margin-left: 120px;
		}
		
		.button-wrap {
			text-align: center;
			margin-top: 80px; /* 하단 버튼 위 여백 */
		}
	</style>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdn.iamport.kr/v1/iamport.js"></script>
</head>
<body>
<main layout:fragment="content"	
		  th:data-product-name="${productName}"
	      th:data-customer-name="${customerName}"
	      th:data-premium="${premium}">
		  
	<div class="payment_wrapper">
		<h1>보험료 <span th:text="|${#numbers.formatInteger(premium,0,'COMMA')} 원|">0원</span>에 대한<br> 결제를 진행합니다</h1>
		
		<div class="test-button-wrap"> 
			<button id="test_pay_btn" onclick="requestPay()">보험료 결제하기 테스트버튼</button>
		    <button id="test_complete_btn" onclick="activateNextBtn()">결제완료</button>
		</div>
		
		<form id="cardForm" th:action="@{/mall2/payment}" method="POST">		
	

			<h3 class="table-title">카드 정보 입력</h3>
			
			<table class="custom-table">
				<tr><th>카드소유자</th>
					<td>고객님 본인 명의의 신용/체크 카드만 가능</td>
				</tr>
				<tr><th>카드 이름</th>
					<td><input type="text" id="card_name" name="card_name" placeholder="VISA, Master 등"></td>
				</tr>
				<tr><th>카드 번호</th>
					<td><input type="text" id="card_number" name="card_number" placeholder="1234-5678-1234-5678"></td>
				</tr>
				<tr><th>유효 기간</th>
					<td><input type="text" id="expiry" name="expiry" placeholder="MM/YY"></td>
				</tr>
			</table>
			
			<p class="card-notice">
				* 고객님의 카드정보는 저장되지 않으며, 결제정보 진위여부를 위해서만 사용됩니다.<br>
				* 추후에 정기결제 등록 기능을 추가 할 예정입니다.
			</p>
			
			

			
			
		<div class="button-wrap">
			<button type="button" class="prev-btn" onclick="location.href=`${contextPath}mall2/notice`">이전</button>
			<button type="submit" class="next-btn" disabled>계약 완료하기</button>
		</div>
	</form>	
	
	</div>
	
	<script src="https://cdn.iamport.kr/js/iamport.payment-1.2.0.js"></script>
	<script th:src="@{/mall/js/payment_form.js}"></script>
</main>
</body>
</html>
